name: CI

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - "**"

jobs:
  lint:
    name: Lint
    runs-on:
      - default
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install utils
        run: |
          sudo apt-get update && sudo apt-get install -qy curl make git jq

      - name: Lint
        run: make lint
  build:
    name: Build
    runs-on:
      - default
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install utils
        run: |
          sudo apt-get update && sudo apt-get install -qy curl make git jq

      - name: Build
        run: make build

      - name: Bin
        uses: actions/upload-artifact@v7
        with:
          name: binance-proxy
          path: ./bin/binance-proxy

